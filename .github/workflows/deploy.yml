# Push to main → run unit tests → if they pass, deploy to the VPS.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST     54.206.46.36
#   VPS_USER     ubuntu
#   VPS_SSH_KEY  the full contents of the server's private key (.pem)
name: Test and deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also allows a manual "Run workflow" button

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test test/unit.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: ~/bin/deploy-backend.sh
